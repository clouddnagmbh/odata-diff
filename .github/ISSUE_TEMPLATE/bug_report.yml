name: Bug report
description: A wrong classification, a parse error or a crash
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `npx odatatailor-diff --version`
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: The call you ran. Leave out header values and host names you don't want to share.
      placeholder: odata-diff before.xml after.xml --fail-on breaking
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Output and exit code
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: metadata
    attributes:
      label: $metadata excerpt
      description: The smallest part of both documents that shows the problem. Remove anything confidential.
      render: xml
  - type: dropdown
    id: source
    attributes:
      label: Service
      options:
        - SAP Gateway (OData V2)
        - SAP RAP (OData V4)
        - SAP CAP
        - other
