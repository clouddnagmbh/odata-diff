name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: cli
          path: dist/cli.js

  # The published CLI promises Node.js 20 (engines); run the built file there.
  node20:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cli
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node dist/cli.js src/__fixtures__/v1.xml src/__fixtures__/v2-additive.xml
      - name: breaking changes exit with 1
        run: |
          set +e
          node dist/cli.js src/__fixtures__/v1.xml src/__fixtures__/v2-breaking.xml
          test $? -eq 1
